# ??? application.properties para Turny API ???????????????????????????????????

# Servidor
server.port=8080
spring.application.name=ApiTurny

# ??? PostgreSQL ???????????????????????????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/turny_db
spring.datasource.username=postgres
spring.datasource.password=1287985dbc
spring.datasource.driver-class-name=org.postgresql.Driver

# ??? JPA / Hibernate ??????????????????????????????????????????????????????????
# validate  ? solo valida, NO toca la BD (producción)
# update    ? actualiza diferencias (desarrollo)
# create    ? borra y recrea (solo primera vez o tests)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Naming strategy ? mapea camelCase Java a snake_case PostgreSQL automáticamente
# ej: negocioId ? negocio_id, createdAt ? created_at
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ??? Seguridad JWT ????????????????????????????????????????????????????????????
turny.jwt.secret=cambiar_esto_por_un_secreto_largo_en_produccion_min_256bits
turny.jwt.expiration-ms=86400000

# ??? CORS (permite peticiones desde la app Android) ??????????????????????????
turny.cors.allowed-origins=*

# ??? Paginación por defecto ???????????????????????????????????????????????????
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100